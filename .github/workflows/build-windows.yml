name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.11.1

      - name: Smoke-import all entry modules
        run: |
          python -X utf8 -c "from scripts import install_diffs, install_parents, report, run_gui; from scripts.songdb import __main__"

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm bms-diff-install.spec

      - name: Show artifact
        run: dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bms-diff-install-windows
          path: dist/bms-diff-install.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bms-diff-install.exe
          generate_release_notes: true
          body: |
            ## 使い方

            1. 下の **Assets** から `bms-diff-install.exe` を DL
            2. ダブルクリックで起動
            3. 4項目を入力して「実行」を押す:
               - 難易度表 `header.json` URL
               - beatoraja の `songdata.db` パス
               - 楽曲フォルダ (music root) パス
               - 作業ディレクトリ (state dir、空フォルダどこでも)
            4. dry-run → 親DL → 差分配置 → `songdata.db` 更新 → 未配置リスト出力 を一気通貫

            **前提**: 親アーカイブ展開には [7-Zip](https://www.7-zip.org/) が別途必要 (.zip のみで済むなら不要)。

            詳細・制約は [README](https://github.com/nnsi/bms-diff-install-cc-skill#クイックスタート-gui-exe-windows) 参照。

            ---
